<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>골목카페 운영 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Gowun+Batang:wght@400;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    /* 공통 디자인 값: 대시보드 모든 페이지가 같은 블록을 쓴다 (손님용 homepage.html과 같은 무화과 · 레몬 · 레이스 톤) */
    :root {
      --bg: #fbf6ec;
      --surface: #fffdf8;
      --linen: #f2e9d8;
      --fig: #5e2a3a;
      --fig-deep: #45202c;
      --fig-soft: #f4e5e2;
      --lemon: #f2dc86;
      --basil: #6f7f4f;
      --gold: #b08a3c;
      --text: #2e2427;
      --muted: #7d6c66;
      --border: #e4d6bd;
      --danger: #c0392b;
      --danger-soft: #fbe7e4;
      --radius: 14px;
      --font: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      --serif: "Gowun Batang", "Noto Serif KR", serif;
      --accent: "Cormorant Garamond", "Gowun Batang", serif;
      --net: radial-gradient(circle, rgba(94, 42, 58, .06) 1px, transparent 1.3px) 0 0 / 7px 7px;
    }

    /* 공통 모양: 대시보드 모든 페이지가 같은 블록을 쓴다 (여백 · 카드 · 입력칸 · 버튼 · 알림) */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--font); background: var(--surface); color: var(--text); font-size: 16px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    h1 { margin: 0 0 4px; font-family: var(--serif); font-size: 28px; color: var(--fig); letter-spacing: -.01em; }
    h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; color: var(--fig); }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .card { position: relative; background: var(--net), var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); min-width: 0; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--fig); outline-offset: -1px; }
    .btn, .btn-line { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 22px; border-radius: 999px; font-weight: 700; white-space: nowrap; text-decoration: none; cursor: pointer; }
    .btn { border: 1px solid var(--fig); background: var(--fig); color: var(--surface); }
    .btn:hover { background: var(--fig-deep); border-color: var(--fig-deep); }
    .btn-line { border: 1px solid var(--fig); background: var(--surface); color: var(--fig); }
    .btn-line:hover { background: var(--fig-soft); }
    .btn:disabled, .btn-line:disabled { border-color: var(--border); background: var(--linen); color: var(--muted); cursor: default; }
    .btn-ghost { width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--fig); font-size: 20px; cursor: pointer; }
    .btn-ghost:hover { background: var(--fig-soft); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 22px; border-radius: 999px; background: var(--fig-deep); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    @media (max-width: 720px) { body { padding: 16px; } }

    /* 틀(index)만: 화면 전체를 왼쪽 메뉴 + 가운데 화면으로 나눈다 */
    html, body { height: 100%; }
    body { padding: 0; display: flex; background: var(--bg); }
    [hidden] { display: none !important; }

    /* 왼쪽 메뉴 */
    .sidebar {
      position: relative;
      z-index: 1;
      width: 220px;
      flex-shrink: 0;
      background: var(--fig-deep);
      color: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
      gap: 4px;
    }
    .brand { display: flex; flex-direction: column; padding: 8px 12px 24px; white-space: nowrap; font-family: var(--serif); font-size: 22px; font-weight: 700; }
    .brand i { font-family: var(--accent); font-weight: 400; font-size: 17px; color: var(--lemon); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--bg);
      font-size: 17px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .nav-item:hover { background: rgba(69, 32, 44, .55); }
    .nav-item.active { background: var(--bg); color: var(--fig); font-weight: 700; }
    .nav-item .icon { font-size: 20px; width: 24px; text-align: center; }
    .nav-guest { margin-top: 16px; text-decoration: none; }

    /* 가운데 화면 */
    .main { flex: 1; min-width: 0; padding: 16px; }
    .main iframe, .home {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    /* 홈 (다른 페이지의 body와 같은 여백) */
    .home { overflow-y: auto; padding: 24px; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--linen); color: var(--fig-deep); border-radius: var(--radius); padding: 16px 20px; }
    /* 무늬 없이 버건디만 (메뉴 · 재고의 "추가" 버튼과 같은 색) */
    .stat.dark { background: var(--fig); color: var(--bg); }
    .stat.alert { background: var(--danger-soft); color: var(--danger); }
    .stat .label { font-size: 14px; opacity: .85; }
    .stat .value { margin-top: 4px; font-family: var(--serif); font-size: clamp(20px, 2.4vw, 28px); font-weight: 700; white-space: nowrap; }
    .stat .note { margin-top: 2px; font-size: 13px; opacity: .8; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; }

    /* 7일 매출 막대 */
    .chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 220px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
    .bar-amt { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .bar { width: 100%; max-width: 56px; background: var(--fig-soft); border-radius: 999px 999px 4px 4px; min-height: 2px; }
    .bar-col.today .bar { background: var(--fig); }
    .bar-col.today .bar-amt { color: var(--fig-deep); font-weight: 700; }
    .bar-day { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .bar-col.weekend .bar-day { color: var(--danger); }
    .chart-sum { margin-top: 12px; color: var(--muted); font-size: 14px; }

    /* 오늘 브리핑 */
    .brief { margin: 0; padding-left: 0; list-style: none; }
    .brief li { position: relative; padding: 10px 0 10px 32px; font-size: 17px; line-height: 1.6; border-bottom: 1px dashed var(--border); }
    .brief li:last-child { border-bottom: 0; }
    .brief li::before {
      content: attr(data-n); position: absolute; left: 0; top: 12px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--fig); color: var(--bg); font-size: 13px; font-weight: 700; text-align: center; line-height: 22px;
    }
    .muted { margin: 0; color: var(--muted); }
    .error-text { margin: 0; color: var(--danger); }

    /* 좁은 화면(태블릿): 틀은 사이드바가 있어 다른 페이지(720px)보다 일찍(820px) 아이콘만 보이게 접는다 */
    @media (max-width: 820px) {
      .sidebar { width: 72px; padding: 16px 8px; }
      .brand { align-items: center; font-size: 24px; padding: 8px 0 20px; }
      .brand .label, .nav-item .label { display: none; }
      .nav-item { justify-content: center; padding: 14px 0; }
      .main { padding: 8px; }
      .home { padding: 16px; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .stat .value { font-size: 24px; }
      .chart { gap: 4px; height: 180px; }
      .bar-amt { font-size: 10px; }
    }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand"><span>☕<span class="label"> 골목카페</span></span><i class="label">fig &amp; lace</i></div>
    <button class="nav-item" data-page="home"><span class="icon">🏠</span><span class="label">홈</span></button>
    <button class="nav-item" data-page="sales.html"><span class="icon">💰</span><span class="label">매출</span></button>
    <button class="nav-item" data-page="menu.html"><span class="icon">📋</span><span class="label">메뉴 · 재고</span></button>
    <button class="nav-item" data-page="reviews.html"><span class="icon">💬</span><span class="label">리뷰</span></button>
    <button class="nav-item" data-page="promo.html"><span class="icon">📣</span><span class="label">홍보</span></button>
    <button class="nav-item" data-page="rivals.html"><span class="icon">📍</span><span class="label">주변 카페</span></button>
    <!-- 손님용 홈페이지: iframe에 띄우지 않고 그 파일로 바로 넘어간다 (data-page 없음) -->
    <a class="nav-item nav-guest" href="homepage.html"><span class="icon">🌐</span><span class="label">홈페이지</span></a>
  </nav>

  <main class="main">
    <section class="home" id="home" hidden>
      <h1>🏠 오늘 장사</h1>
      <p class="sub" id="home-date"></p>

      <div class="stat-grid">
        <div class="stat dark"><div class="label">오늘 매출</div><div class="value" id="s-amount">-</div><div class="note" id="s-amount-note"></div></div>
        <div class="stat"><div class="label">오늘 판매</div><div class="value" id="s-qty">-</div><div class="note" id="s-count"></div></div>
        <div class="stat" id="s-low-box"><div class="label">재고 부족 (5개 이하)</div><div class="value" id="s-low">-</div><div class="note" id="s-low-names"></div></div>
        <div class="stat"><div class="label">답글 대기 리뷰</div><div class="value" id="s-reviews">-</div><div class="note" id="s-rating"></div></div>
      </div>

      <section class="card">
        <div class="panel-head">
          <h2>📋 오늘 브리핑</h2>
          <button class="btn" id="brief-btn" disabled>🤖 오늘 브리핑</button>
        </div>
        <div id="brief"><p class="muted">버튼을 누르면 AI가 위 숫자와 7일 매출을 보고 세 줄로 정리해 줘요</p></div>
      </section>

      <section class="card">
        <h2>📈 최근 7일 매출</h2>
        <div class="chart" id="chart"></div>
        <div class="chart-sum" id="chart-sum"></div>
      </section>
    </section>
    <iframe id="view" title="가운데 화면" hidden></iframe>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://nmjnzcmxckaftvztfjhj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6xkxdgP44bIiejCxat0SjA_o8E-R5EO';
    const LOW_STOCK = 5;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------- 공통 도우미: 모든 페이지가 같은 블록을 쓴다 ----------
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';

    function toast(msg, isError = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.className = 'toast', isError ? 4000 : 2500);
    }

    // 에러를 사장님이 알아듣는 말로 바꾼다 (원문은 개발자 도구에만 남김)
    function friendly(err) {
      console.error(err);
      const m = String(err?.message ?? err ?? '');
      if (/failed to fetch|networkerror|load failed/i.test(m)) return '인터넷 연결이 끊긴 것 같아요. 연결을 확인하고 다시 해 주세요';
      if (/[가-힣]/.test(m)) return m; // 우리가 만든 한국어 안내는 그대로
      return '잠깐 문제가 생겼어요. 잠시 후 다시 해 주세요';
    }
    // ---------- 공통 도우미 끝 ----------

    // ---------- AI 호출: index · reviews · promo가 같은 블록을 쓴다 ----------
    const AI_URL = SUPABASE_URL + '/functions/v1/cafe-ai';
    const AI_BUSY = 'AI가 지금 바빠서 답을 못 했어요. 1~2분 뒤에 다시 눌러 주세요';
    const AI_FIELDS = {
      review: b => typeof b.sentiment === 'string' && typeof b.reply === 'string' && b.reply.trim() !== '',
      promo: b => Array.isArray(b.captions) && b.captions.length >= 3,
      brief: b => Array.isArray(b.lines) && b.lines.length >= 3,
    };

    // 무료 모델이라 1~2분 걸리거나 실패할 수 있다
    async function askAI(type, data) {
      let res;
      try {
        res = await fetch(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, data }),
        });
      } catch (err) {
        throw new Error(friendly(err));
      }
      const body = await res.json().catch(() => ({}));
      if (res.status === 400 && body.error) throw new Error(body.error);
      if (!res.ok || !AI_FIELDS[type](body)) {
        console.error('cafe-ai', res.status, body);
        throw new Error(AI_BUSY);
      }
      return body;
    }
    // ---------- AI 호출 끝 ----------

    // ---------- 왼쪽 메뉴 → 가운데 화면 ----------
    const view = $('view');
    const home = $('home');
    const navItems = document.querySelectorAll('.nav-item[data-page]'); // 홈페이지 링크(.nav-guest)는 빼고
    let openSeq = 0; // 메뉴를 빠르게 바꿔 누르면 마지막 클릭만 반영

    // iframe 안에 보여줄 "준비중" 화면 (index와 같은 색·글꼴)
    function placeholder(title) {
      const css = document.querySelector('style').textContent.match(/:root\s*{[^}]*}/)[0];
      return `<!doctype html><html lang="ko"><head><meta charset="utf-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
        <style>${css}
          body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
                 font-family:var(--font); background:var(--surface); color:var(--text); }
          .emoji { font-size:56px; } h1 { margin:16px 0 8px; font-size:26px; } p { margin:0; color:var(--muted); font-size:17px; }
        </style></head><body>
        <div class="emoji">🚧</div><h1>${esc(title)}</h1><p>준비중이에요. 곧 만들어질 거예요!</p>
        </body></html>`;
    }

    async function pageExists(page) {
      try {
        const res = await fetch(page, { method: 'HEAD', cache: 'no-store' });
        return res.ok;
      } catch {
        return false;
      }
    }

    async function open(page) {
      const seq = ++openSeq;
      const item = [...navItems].find(b => b.dataset.page === page) || navItems[0];
      page = item.dataset.page;
      navItems.forEach(b => b.classList.toggle('active', b === item));
      history.replaceState(null, '', '#' + page.replace('.html', ''));

      // 홈은 iframe 대신 index 안의 #home 영역을 보여준다
      home.hidden = page !== 'home';
      view.hidden = page === 'home';
      if (page === 'home') {
        view.removeAttribute('src');
        view.removeAttribute('srcdoc');
        return loadHome();
      }
      const exists = await pageExists(page);
      if (seq !== openSeq) return; // 그사이 다른 메뉴를 눌렀다
      if (exists) {
        view.removeAttribute('srcdoc');
        view.src = page;
      } else {
        view.removeAttribute('src');
        view.srcdoc = placeholder(item.querySelector('.label').textContent);
      }
    }

    // ---------- 홈: 숫자 카드 4개 · 7일 매출 · 오늘 브리핑 ----------
    const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    let homeData = null;    // 브리핑에 보낼 숫자
    let briefing = false;   // 브리핑을 기다리는 중에는 숫자를 다시 읽어도 버튼을 풀지 않는다

    async function loadHome() {
      const now = new Date();
      $('home-date').textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

      // 7일 전 0시부터 (오늘 포함 7일)
      const from = new Date(now);
      from.setHours(0, 0, 0, 0);
      from.setDate(from.getDate() - 6);

      const [sales, menus, reviews] = await Promise.all([
        db.from('sales').select('quantity, amount, sold_at').gte('sold_at', from.toISOString()),
        db.from('menus').select('name, stock'),
        db.from('reviews').select('rating, reply'),
      ]);
      const err = sales.error || menus.error || reviews.error;
      if (err) {
        $('brief').innerHTML = `<p class="error-text">숫자를 불러오지 못했어요. ${esc(friendly(err))}</p>`;
        return;
      }

      // 날짜별 합계
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(from);
        d.setDate(from.getDate() + i);
        days.push({ date: d, key: dayKey(d), amount: 0, qty: 0, count: 0 });
      }
      const byKey = Object.fromEntries(days.map(d => [d.key, d]));
      for (const s of sales.data) {
        const d = byKey[dayKey(new Date(s.sold_at))];
        if (d) { d.amount += s.amount; d.qty += s.quantity; d.count += 1; }
      }
      const today = days[6];
      const yesterday = days[5];

      const low = menus.data.filter(m => m.stock <= LOW_STOCK).sort((a, b) => a.stock - b.stock);
      const waiting = reviews.data.filter(r => !r.reply);
      const avgRating = reviews.data.length ? reviews.data.reduce((s, r) => s + r.rating, 0) / reviews.data.length : 0;

      // 카드 4개
      $('s-amount').textContent = won(today.amount);
      const diff = today.amount - yesterday.amount;
      $('s-amount-note').textContent = `어제 ${won(yesterday.amount)} (${diff >= 0 ? '+' : ''}${diff.toLocaleString('ko-KR')})`;
      $('s-qty').textContent = today.qty + '개';
      $('s-count').textContent = today.count + '건';
      $('s-low').textContent = low.length + '개';
      $('s-low-names').textContent = low.map(m => `${m.name} ${m.stock}`).join(', ') || '모두 넉넉해요';
      $('s-low-box').classList.toggle('alert', low.length > 0);
      $('s-reviews').textContent = waiting.length + '개';
      $('s-rating').textContent = reviews.data.length ? `평균 별점 ${avgRating.toFixed(1)}` : '';

      // 7일 막대
      const max = Math.max(...days.map(d => d.amount), 1);
      $('chart').innerHTML = days.map((d, i) => {
        const dow = d.date.getDay();
        const label = i === 6 ? '오늘' : `${d.date.getMonth() + 1}/${d.date.getDate()}(${'일월화수목금토'[dow]})`;
        const short = d.amount >= 10000 ? Math.round(d.amount / 1000) / 10 + '만' : d.amount.toLocaleString('ko-KR');
        return `<div class="bar-col ${i === 6 ? 'today' : ''} ${dow === 0 || dow === 6 ? 'weekend' : ''}" title="${label} ${won(d.amount)} · ${d.count}건">
          <span class="bar-amt">${short}</span>
          <div class="bar" style="height:${Math.round(d.amount / max * 100)}%"></div>
          <span class="bar-day">${label}</span>
        </div>`;
      }).join('');
      const total7 = days.reduce((s, d) => s + d.amount, 0);
      $('chart-sum').textContent = `7일 합계 ${won(total7)} · 하루 평균 ${won(Math.round(total7 / 7))} (오늘은 지금까지 기준)`;

      homeData = {
        날짜: now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }),
        지금시각: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
        오늘매출: today.amount,
        어제매출: yesterday.amount,
        오늘판매수량: today.qty,
        오늘판매건수: today.count,
        재고부족메뉴: low.map(m => `${m.name} ${m.stock}개`),
        답글대기리뷰: waiting.length,
        평균별점: Number(avgRating.toFixed(1)),
        최근7일매출: days.map(d => ({ 날짜: d.key, 매출: d.amount })),
      };
      if (!briefing) $('brief-btn').disabled = false;
    }

    $('brief-btn').addEventListener('click', async () => {
      if (!homeData || briefing) return;
      const btn = $('brief-btn');
      briefing = true;
      btn.disabled = true;
      $('brief').innerHTML = '<p class="muted">AI가 브리핑을 쓰고 있어요… (1~2분 걸릴 수 있어요)</p>';
      try {
        const ai = await askAI('brief', homeData);
        $('brief').innerHTML = '<ol class="brief">' + ai.lines.map((l, i) => `<li data-n="${i + 1}">${esc(l)}</li>`).join('') + '</ol>';
      } catch (err) {
        $('brief').innerHTML = `<p class="error-text">${esc(err.message)}</p>`;
      } finally {
        briefing = false;
        btn.disabled = false;
      }
    });

    navItems.forEach(b => b.addEventListener('click', () => open(b.dataset.page)));

    // 다른 프로그램에 갔다 오거나 자정이 지나면 홈 숫자를 새로 읽는다
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !home.hidden) loadHome();
    });

    // 새로고침해도 보던 화면 유지 (#sales → sales.html)
    const hash = location.hash.slice(1);
    open(hash && hash !== 'home' ? hash + '.html' : 'home');
  </script>
</body>
</html>
