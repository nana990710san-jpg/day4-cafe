<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메뉴 · 재고</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Gowun+Batang:wght@400;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    /* 공통 디자인 값: 대시보드 모든 페이지가 같은 블록을 쓴다 (손님용 homepage.html과 같은 무화과 · 레몬 · 레이스 톤) */
    :root {
      --bg: #fbf6ec;
      --surface: #fffdf8;
      --linen: #f2e9d8;
      --fig: #5e2a3a;
      --fig-deep: #45202c;
      --fig-soft: #f4e5e2;
      --lemon: #f2dc86;
      --basil: #6f7f4f;
      --gold: #b08a3c;
      --text: #2e2427;
      --muted: #7d6c66;
      --border: #e4d6bd;
      --danger: #c0392b;
      --danger-soft: #fbe7e4;
      --radius: 14px;
      --font: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      --serif: "Gowun Batang", "Noto Serif KR", serif;
      --accent: "Cormorant Garamond", "Gowun Batang", serif;
      --lace: url("assets/lace-ivory.png") 0 0 / 300px auto;  /* 사용자가 준 레이스 사진에서 실만 따낸 아이보리 무늬 (투명 바탕) */
      --net: radial-gradient(circle, rgba(94, 42, 58, .06) 1px, transparent 1.3px) 0 0 / 7px 7px;
    }

    /* 공통 모양: 대시보드 모든 페이지가 같은 블록을 쓴다 (여백 · 카드 · 입력칸 · 버튼 · 알림) */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--font); background: var(--surface); color: var(--text); font-size: 16px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    h1 { margin: 0 0 4px; font-family: var(--serif); font-size: 28px; color: var(--fig); letter-spacing: -.01em; }
    h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; color: var(--fig); }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .card { position: relative; background: var(--net), var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); min-width: 0; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--fig); outline-offset: -1px; }
    .btn, .btn-line { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 22px; border-radius: 999px; font-weight: 700; white-space: nowrap; text-decoration: none; cursor: pointer; }
    .btn { border: 1px solid var(--fig); background: var(--fig); color: var(--surface); }
    .btn:hover { background: var(--fig-deep); border-color: var(--fig-deep); }
    .btn-line { border: 1px solid var(--fig); background: var(--surface); color: var(--fig); }
    .btn-line:hover { background: var(--fig-soft); }
    .btn:disabled, .btn-line:disabled { border-color: var(--border); background: var(--linen); color: var(--muted); cursor: default; }
    .btn-ghost { width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--fig); font-size: 20px; cursor: pointer; }
    .btn-ghost:hover { background: var(--fig-soft); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 22px; border-radius: 999px; background: var(--fig-deep); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    @media (max-width: 720px) { body { padding: 16px; } }

    /* 메뉴 추가 폼 */
    .add-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .add-form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); min-width: 0; }
    .add-form input, .add-form select { width: 100%; }

    /* 메뉴 목록 */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 14px; color: var(--muted); font-weight: 600; }
    td.name { font-weight: 700; font-size: 17px; min-width: 130px; }
    .badge-cat { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--linen); color: var(--fig-deep); font-size: 13px; white-space: nowrap; }
    .price-input { width: 110px; text-align: right; }
    .stock-box { display: flex; align-items: center; gap: 6px; }
    .stock-input { width: 70px; text-align: center; font-weight: 700; }

    /* 재고 5개 이하 */
    tr.low td.name { color: var(--danger); }
    tr.low .stock-input { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
    .badge-low { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--danger); color: var(--surface); font-size: 12px; vertical-align: middle; }

    .summary { display: flex; gap: 16px; margin-bottom: 12px; color: var(--muted); }
    .summary b { color: var(--text); }
    .summary .low b { color: var(--danger); }

    @media (max-width: 720px) {
      .add-form { grid-template-columns: 1fr 1fr; }
      .add-form label:first-child { grid-column: 1 / -1; }
      .add-form .btn { grid-column: 1 / -1; }
      .col-cat { display: none; }
      th, td { padding: 10px 6px; }
      .price-input { width: 90px; }
      .stock-input { width: 56px; }
    }
  </style>
</head>
<body>
  <h1>📋 메뉴 · 재고</h1>
  <p class="sub">메뉴를 추가하고 가격과 재고를 고쳐요. 재고가 5개 이하면 빨간색으로 보여요.</p>

  <section class="card">
    <h2>메뉴 추가</h2>
    <form id="add-form" class="add-form">
      <label>메뉴 이름<input name="name" required placeholder="예: 바닐라 라떼"></label>
      <label>분류
        <select name="category">
          <option>커피</option>
          <option>음료</option>
          <option>디저트</option>
          <option>아이스크림</option>
          <option>베이커리</option>
          <option>기타</option>
        </select>
      </label>
      <label>가격(원)<input name="price" type="number" min="0" step="100" required placeholder="4500"></label>
      <label>재고<input name="stock" type="number" min="0" value="0" required></label>
      <button class="btn" type="submit">추가</button>
    </form>
  </section>

  <section class="card">
    <h2>메뉴 목록</h2>
    <div class="summary" id="summary"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>메뉴</th><th class="col-cat">분류</th><th>가격(원)</th><th>재고</th><th></th></tr>
        </thead>
        <tbody id="list"><tr><td colspan="5" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://nmjnzcmxckaftvztfjhj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6xkxdgP44bIiejCxat0SjA_o8E-R5EO';
    const LOW_STOCK = 5;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------- 공통 도우미: 모든 페이지가 같은 블록을 쓴다 ----------
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';

    function toast(msg, isError = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.className = 'toast', isError ? 4000 : 2500);
    }

    // 에러를 사장님이 알아듣는 말로 바꾼다 (원문은 개발자 도구에만 남김)
    function friendly(err) {
      console.error(err);
      const m = String(err?.message ?? err ?? '');
      if (/failed to fetch|networkerror|load failed/i.test(m)) return '인터넷 연결이 끊긴 것 같아요. 연결을 확인하고 다시 해 주세요';
      if (/[가-힣]/.test(m)) return m; // 우리가 만든 한국어 안내는 그대로
      return '잠깐 문제가 생겼어요. 잠시 후 다시 해 주세요';
    }
    // ---------- 공통 도우미 끝 ----------

    const list = $('list');

    async function load() {
      const { data, error } = await db.from('menus').select('*').order('category').order('name');
      if (error) {
        list.innerHTML = '<tr><td colspan="5" class="empty">메뉴를 불러오지 못했어요. 잠시 후 새로고침해 주세요</td></tr>';
        return toast(friendly(error), true);
      }
      render(data);
    }

    function render(menus) {
      const low = menus.filter(m => m.stock <= LOW_STOCK).length;
      $('summary').innerHTML =
        `<span>전체 <b>${menus.length}</b>개</span><span class="low">재고 부족 <b>${low}</b>개</span>`;

      if (!menus.length) {
        list.innerHTML = '<tr><td colspan="5" class="empty">아직 메뉴가 없어요. 위에서 추가해 주세요</td></tr>';
        return;
      }
      list.innerHTML = menus.map(m => `
        <tr data-id="${m.id}" class="${m.stock <= LOW_STOCK ? 'low' : ''}">
          <td class="name">${esc(m.name)}${m.stock <= LOW_STOCK ? '<span class="badge-low">재고 부족</span>' : ''}</td>
          <td class="col-cat"><span class="badge-cat">${esc(m.category)}</span></td>
          <td><input class="price-input" type="number" min="0" step="100" value="${m.price}" data-orig="${m.price}" aria-label="${esc(m.name)} 가격"></td>
          <td>
            <div class="stock-box">
              <button class="btn-ghost" data-step="-1" aria-label="재고 1 빼기">−</button>
              <input class="stock-input" type="number" min="0" value="${m.stock}" data-orig="${m.stock}" aria-label="${esc(m.name)} 재고">
              <button class="btn-ghost" data-step="1" aria-label="재고 1 더하기">+</button>
            </div>
          </td>
          <td><button class="btn save" disabled>저장</button></td>
        </tr>`).join('');
    }

    // 값이 바뀐 줄만 저장 버튼 켜기
    function markDirty(row) {
      const price = row.querySelector('.price-input');
      const stock = row.querySelector('.stock-input');
      row.querySelector('.save').disabled = price.value === price.dataset.orig && stock.value === stock.dataset.orig;
    }

    list.addEventListener('input', e => {
      const row = e.target.closest('tr');
      if (row) markDirty(row);
    });

    list.addEventListener('click', async e => {
      const row = e.target.closest('tr');
      if (!row) return;

      const step = e.target.dataset.step;
      if (step) {
        const input = row.querySelector('.stock-input');
        input.value = Math.max(0, (parseInt(input.value, 10) || 0) + Number(step));
        return markDirty(row);
      }

      if (e.target.classList.contains('save')) {
        const priceInput = row.querySelector('.price-input');
        const stockInput = row.querySelector('.stock-input');
        const price = parseInt(priceInput.value, 10);
        const stock = parseInt(stockInput.value, 10);
        if (!(price >= 0) || !(stock >= 0)) return toast('가격과 재고는 0 이상의 숫자로 넣어 주세요', true);

        // 바뀐 칸만 보낸다. 재고는 화면을 연 뒤 다른 곳(판매 등)에서 바뀌었으면 덮어쓰지 않는다.
        const fields = {};
        if (priceInput.value !== priceInput.dataset.orig) fields.price = price;
        if (stockInput.value !== stockInput.dataset.orig) fields.stock = stock;
        let query = db.from('menus').update(fields).eq('id', row.dataset.id);
        if ('stock' in fields) query = query.eq('stock', Number(stockInput.dataset.orig));

        e.target.disabled = true;
        const { data, error } = await query.select('id');
        if (error) {
          e.target.disabled = false;
          return toast('저장하지 못했어요. ' + friendly(error), true);
        }
        if (!data.length) {
          toast('그사이 판매가 들어와 재고가 바뀌었어요. 새 숫자로 다시 불러왔으니 확인하고 다시 저장해 주세요', true);
          return load();
        }
        toast('저장했어요');
        load();
      }
    });

    // Enter로도 저장
    list.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        const save = e.target.closest('tr').querySelector('.save');
        if (!save.disabled) save.click();
      }
    });

    $('add-form').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const f = form.elements; // form.name은 폼 자체의 name 속성이라 elements로 읽는다
      const menu = {
        name: f.name.value.trim(),
        category: f.category.value,
        price: parseInt(f.price.value, 10),
        stock: parseInt(f.stock.value, 10),
      };
      if (!menu.name) return toast('메뉴 이름을 넣어 주세요', true);
      if (!(menu.price >= 0) || !(menu.stock >= 0)) return toast('가격과 재고는 0 이상의 숫자로 넣어 주세요', true);

      const btn = form.querySelector('button');
      btn.disabled = true;
      const { error } = await db.from('menus').insert(menu);
      btn.disabled = false;
      if (error) return toast('메뉴를 추가하지 못했어요. ' + friendly(error), true);

      toast(`'${menu.name}' 메뉴를 추가했어요 (${won(menu.price)})`);
      form.reset();
      f.name.focus();
      load();
    });

    load();
  </script>
</body>
</html>
