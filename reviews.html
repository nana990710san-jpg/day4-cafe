<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리뷰</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Gowun+Batang:wght@400;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    /* 공통 디자인 값: 대시보드 모든 페이지가 같은 블록을 쓴다 (손님용 homepage.html과 같은 무화과 · 레몬 · 레이스 톤) */
    :root {
      --bg: #fbf6ec;
      --surface: #fffdf8;
      --linen: #f2e9d8;
      --fig: #5e2a3a;
      --fig-deep: #45202c;
      --fig-soft: #f4e5e2;
      --lemon: #f2dc86;
      --basil: #6f7f4f;
      --gold: #b08a3c;
      --text: #2e2427;
      --muted: #7d6c66;
      --border: #e4d6bd;
      --danger: #c0392b;
      --danger-soft: #fbe7e4;
      --radius: 14px;
      --font: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      --serif: "Gowun Batang", "Noto Serif KR", serif;
      --accent: "Cormorant Garamond", "Gowun Batang", serif;
      --lace: url("assets/lace-ivory.png") 0 0 / 300px auto;  /* 사용자가 준 레이스 사진에서 실만 따낸 아이보리 무늬 (투명 바탕) */
      --net: radial-gradient(circle, rgba(94, 42, 58, .06) 1px, transparent 1.3px) 0 0 / 7px 7px;
    }

    /* 공통 모양: 대시보드 모든 페이지가 같은 블록을 쓴다 (여백 · 카드 · 입력칸 · 버튼 · 알림) */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--font); background: var(--surface); color: var(--text); font-size: 16px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    h1 { margin: 0 0 4px; font-family: var(--serif); font-size: 28px; color: var(--fig); letter-spacing: -.01em; }
    h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; color: var(--fig); }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .card { position: relative; background: var(--net), var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); min-width: 0; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--fig); outline-offset: -1px; }
    .btn, .btn-line { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 22px; border-radius: 999px; font-weight: 700; white-space: nowrap; text-decoration: none; cursor: pointer; }
    .btn { border: 1px solid var(--fig); background: var(--fig); color: var(--surface); }
    .btn:hover { background: var(--fig-deep); border-color: var(--fig-deep); }
    .btn-line { border: 1px solid var(--fig); background: var(--surface); color: var(--fig); }
    .btn-line:hover { background: var(--fig-soft); }
    .btn:disabled, .btn-line:disabled { border-color: var(--border); background: var(--linen); color: var(--muted); cursor: default; }
    .btn-ghost { width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--fig); font-size: 20px; cursor: pointer; }
    .btn-ghost:hover { background: var(--fig-soft); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 22px; border-radius: 999px; background: var(--fig-deep); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    @media (max-width: 720px) { body { padding: 16px; } }

    /* 요약 */
    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .total { background: var(--linen); color: var(--fig-deep); border-radius: var(--radius); padding: 16px 20px; }
    .total.dark { background: var(--lace), var(--fig); color: var(--bg); }
    .total .label { font-size: 14px; opacity: .8; }
    .total .value { margin-top: 4px; font-family: var(--serif); font-size: 28px; font-weight: 700; }

    /* 필터 */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab { padding: 8px 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--fig); border-color: var(--fig); color: var(--surface); font-weight: 700; }

    /* 리뷰 카드 */
    .review.card { padding: 18px 20px; margin-bottom: 14px; }
    .review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stars { color: var(--gold); font-size: 18px; letter-spacing: 1px; }
    .stars .off { color: var(--border); }
    .date { color: var(--muted); font-size: 14px; }
    .badge { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .badge.s-좋음 { background: rgba(111, 127, 79, .16); color: var(--basil); }
    .badge.s-보통 { background: var(--linen); color: var(--fig-deep); }
    .badge.s-아쉬움 { background: var(--danger-soft); color: var(--danger); }
    .badge.done { background: var(--fig-deep); color: var(--bg); margin-left: auto; }
    .badge.wait { border: 1px solid var(--border); color: var(--muted); margin-left: auto; }
    .content { margin: 12px 0; font-family: var(--serif); font-size: 17px; line-height: 1.6; white-space: pre-wrap; }

    .reply-box { border-top: 1px dashed var(--border); padding-top: 12px; }
    .reply-box label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
    .reply-box textarea { width: 100%; min-height: 84px; resize: vertical; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .thinking { color: var(--muted); font-size: 14px; align-self: center; }

    @media (max-width: 720px) {
      .totals { grid-template-columns: 1fr 1fr; }
      .totals .total:first-child { grid-column: 1 / -1; }
      .total .value { font-size: 24px; }
      .actions .btn, .actions .btn-line { flex: 1; }
    }
  </style>
</head>
<body>
  <h1>💬 리뷰</h1>
  <p class="sub">"AI 분석"을 누르면 AI가 리뷰의 감정을 보고 답글 초안을 써서 저장해요. 답글은 고친 뒤 다시 저장할 수 있어요.</p>

  <div class="totals">
    <div class="total dark"><div class="label">답글 대기</div><div class="value" id="t-wait">-</div></div>
    <div class="total"><div class="label">전체 리뷰</div><div class="value" id="t-all">-</div></div>
    <div class="total"><div class="label">평균 별점</div><div class="value" id="t-avg">-</div></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all">전체</button>
    <button class="tab" data-filter="wait">답글 대기</button>
    <button class="tab" data-filter="done">답글 완료</button>
  </div>

  <div id="list"><div class="empty">불러오는 중…</div></div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://nmjnzcmxckaftvztfjhj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6xkxdgP44bIiejCxat0SjA_o8E-R5EO';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------- 공통 도우미: 모든 페이지가 같은 블록을 쓴다 ----------
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';

    function toast(msg, isError = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.className = 'toast', isError ? 4000 : 2500);
    }

    // 에러를 사장님이 알아듣는 말로 바꾼다 (원문은 개발자 도구에만 남김)
    function friendly(err) {
      console.error(err);
      const m = String(err?.message ?? err ?? '');
      if (/failed to fetch|networkerror|load failed/i.test(m)) return '인터넷 연결이 끊긴 것 같아요. 연결을 확인하고 다시 해 주세요';
      if (/[가-힣]/.test(m)) return m; // 우리가 만든 한국어 안내는 그대로
      return '잠깐 문제가 생겼어요. 잠시 후 다시 해 주세요';
    }
    // ---------- 공통 도우미 끝 ----------

    // ---------- AI 호출: index · reviews · promo가 같은 블록을 쓴다 ----------
    const AI_URL = SUPABASE_URL + '/functions/v1/cafe-ai';
    const AI_BUSY = 'AI가 지금 바빠서 답을 못 했어요. 1~2분 뒤에 다시 눌러 주세요';
    const AI_FIELDS = {
      review: b => typeof b.sentiment === 'string' && typeof b.reply === 'string' && b.reply.trim() !== '',
      promo: b => Array.isArray(b.captions) && b.captions.length >= 3,
      brief: b => Array.isArray(b.lines) && b.lines.length >= 3,
    };

    // 무료 모델이라 1~2분 걸리거나 실패할 수 있다
    async function askAI(type, data) {
      let res;
      try {
        res = await fetch(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, data }),
        });
      } catch (err) {
        throw new Error(friendly(err));
      }
      const body = await res.json().catch(() => ({}));
      if (res.status === 400 && body.error) throw new Error(body.error);
      if (!res.ok || !AI_FIELDS[type](body)) {
        console.error('cafe-ai', res.status, body);
        throw new Error(AI_BUSY);
      }
      return body;
    }
    // ---------- AI 호출 끝 ----------

    let reviews = [];
    let filter = 'all';
    const busy = new Set(); // AI 분석 중인 리뷰 id
    const drafts = {};      // 저장 안 한 답글 (다시 그려도 지워지지 않게)

    async function load() {
      const { data, error } = await db.from('reviews').select('*').order('created_at', { ascending: false });
      if (error) {
        $('list').innerHTML = '<div class="empty">리뷰를 불러오지 못했어요. 잠시 후 새로고침해 주세요</div>';
        return toast(friendly(error), true);
      }
      reviews = data;
      render();
    }

    function stars(rating) {
      const n = Math.min(5, Math.max(0, Math.round(Number(rating) || 0)));
      return '★'.repeat(n) + `<span class="off">${'★'.repeat(5 - n)}</span>`;
    }

    function render() {
      const wait = reviews.filter(r => !r.reply);
      $('t-wait').textContent = wait.length + '개';
      $('t-all').textContent = reviews.length + '개';
      $('t-avg').textContent = reviews.length
        ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1) + '점'
        : '-';

      const shown = filter === 'wait' ? wait : filter === 'done' ? reviews.filter(r => r.reply) : reviews;
      if (!shown.length) {
        $('list').innerHTML = `<div class="empty">${filter === 'wait' ? '답글을 기다리는 리뷰가 없어요 👏' : '리뷰가 없어요'}</div>`;
        return;
      }

      $('list').innerHTML = shown.map(r => {
        const isBusy = busy.has(r.id);
        return `
        <article class="review card" data-id="${r.id}">
          <div class="review-head">
            <span class="stars" aria-label="별점 ${esc(r.rating)}점">${stars(r.rating)}</span>
            <span class="date">${new Date(r.created_at).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })}</span>
            ${r.sentiment ? `<span class="badge s-${esc(r.sentiment)}">${esc(r.sentiment)}</span>` : ''}
            <span class="badge ${r.reply ? 'done' : 'wait'}">${r.reply ? '답글 완료' : '답글 대기'}</span>
          </div>
          <p class="content">${esc(r.content)}</p>
          <div class="reply-box">
            <label for="reply-${r.id}">사장님 답글</label>
            <textarea id="reply-${r.id}" placeholder="AI 분석을 누르면 답글 초안이 들어와요. 직접 써도 돼요" ${isBusy ? 'disabled' : ''}>${esc(drafts[r.id] ?? r.reply)}</textarea>
            <div class="actions">
              <button class="btn" data-act="ai" ${isBusy ? 'disabled' : ''}>${r.reply ? '🤖 AI 다시 분석' : '🤖 AI 분석'}</button>
              <button class="btn-line" data-act="save" ${isBusy ? 'disabled' : ''}>답글 저장</button>
              <button class="btn-line" data-act="copy" ${isBusy ? 'disabled' : ''}>복사</button>
              ${isBusy ? '<span class="thinking">AI가 생각 중이에요… (1~2분 걸릴 수 있어요)</span>' : ''}
            </div>
          </div>
        </article>`;
      }).join('');
    }

    $('tabs').addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      filter = tab.dataset.filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      render();
    });

    async function saveReview(id, fields) {
      const { error } = await db.from('reviews').update(fields).eq('id', id);
      if (error) throw new Error('저장하지 못했어요. ' + friendly(error));
      Object.assign(reviews.find(r => r.id === id), fields);
      delete drafts[id];
    }

    $('list').addEventListener('input', e => {
      const card = e.target.closest('.review');
      if (card && e.target.tagName === 'TEXTAREA') drafts[card.dataset.id] = e.target.value;
    });

    $('list').addEventListener('click', async e => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const card = btn.closest('.review');
      const id = Number(card.dataset.id);
      const review = reviews.find(r => r.id === id);
      const textarea = card.querySelector('textarea');

      if (btn.dataset.act === 'copy') {
        if (!textarea.value.trim()) return toast('복사할 답글이 없어요', true);
        try {
          await navigator.clipboard.writeText(textarea.value);
          toast('답글을 복사했어요');
        } catch {
          textarea.select();
          toast('자동 복사가 안 돼요. 선택된 글을 Ctrl+C로 복사해 주세요', true);
        }
        return;
      }

      if (btn.dataset.act === 'save') {
        const reply = textarea.value.trim() || null;
        try {
          await saveReview(id, { reply });
          toast(reply ? '답글을 저장했어요' : '답글을 비웠어요');
          render();
        } catch (err) {
          toast(err.message, true);
        }
        return;
      }

      // AI 분석: 감정 + 답글 초안을 받아 바로 저장. 칸에 글이 있으면 먼저 묻는다.
      if (textarea.value.trim() && !confirm('지금 칸에 있는 답글을 AI 초안으로 바꿀까요?')) return;
      busy.add(id);
      render();
      try {
        const ai = await askAI('review', { content: review.content, rating: review.rating });
        await saveReview(id, { sentiment: ai.sentiment, reply: ai.reply });
        toast(`AI 분석을 마쳤어요 (감정: ${ai.sentiment})`);
      } catch (err) {
        toast(err.message, true);
      } finally {
        busy.delete(id);
        render();
      }
    });

    load();
  </script>
</body>
</html>
